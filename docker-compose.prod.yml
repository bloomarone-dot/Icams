services:
  db:
    image: postgres:16-alpine
    container_name: icams-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-icams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-icams}
    volumes:
      - icams_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-icams} -d ${POSTGRES_DB:-icams}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - icams

  api:
    build: ./backend
    container_name: icams-api
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-icams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-icams}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    ports:
      - "127.0.0.1:${API_PORT:-8002}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - icams

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: icams-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - icams

volumes:
  icams_pg_data:

networks:
  icams:
    driver: bridge
